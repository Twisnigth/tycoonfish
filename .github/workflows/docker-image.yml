name: Build & push image (GHCR)

# Construit l'image Docker et la publie sur GitHub Container Registry à chaque
# push. Le serveur n'a alors plus qu'à faire `docker compose pull && up -d`.
on:
  push:
    branches: [main, feat/park-builder-pivot]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/twisnigth/tycoonfish:latest
            ghcr.io/twisnigth/tycoonfish:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
