server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Table MIME standard (html/js/css/webp/png/json/svg…). On NE redéclare PAS
    # de bloc `types {}` ici : ça écraserait cette table et casserait le type des
    # .html/.js (→ téléchargement). Les .glb tombent en octet-stream, ce qui
    # convient parfaitement (chargés en binaire par le moteur 3D).
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets versionnés (build Vite) : cache long.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA : tout le reste retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
