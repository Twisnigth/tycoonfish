server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Type MIME des modèles 3D GLB.
    types {
        model/gltf-binary glb;
        image/webp webp;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;
    gzip_min_length 1024;

    # Assets versionnés (build Vite) : cache long.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA : tout le reste retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
